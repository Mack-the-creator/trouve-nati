name: PHP Syntax check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  php-check:
    runs-on: ubuntu-latest

    steps:  
      - name: Checkout repository
        uses: shivammathur/checkout@v04
        with:
          php-version: '8.2'
         
      - name: Check PHP syntax
        run: php -1 index.php

        
    
